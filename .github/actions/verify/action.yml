name: 'Verify gate'
description: 'Install, architecture ratchet, audit, typecheck, test, build — the shared verification gate used by CI (push/PR) and the Publish workflow. The secret scan lives in a dedicated singleton job (audit-fixes 05): it is OS/Node-independent and must not multiply with the matrix.'

inputs:
  node-version:
    description: 'Node.js version to run the gate on'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0   # reads packageManager from package.json
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: "https://registry.npmjs.org/"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Architecture ratchet (audit-fixes 02): new cycles / oversized files /
    # deep imports fail here. Baseline carries only accepted debt, and the
    # type-only cycles were repaid first (ticket 01) so the gate ships clean.
    - name: Architecture ratchet check
      run: pnpm architecture:check
      shell: bash
    - name: Audit (dev deps included, high+ critical gate, dated waivers only)
      run: node scripts/audit-deps.mjs
      shell: bash
    - run: pnpm typecheck
      shell: bash
    - run: pnpm test
      shell: bash
    - run: pnpm build
      shell: bash
    # Deterministic TUI E2E: real PTY, no LLM calls, no secrets. Runs after
    # the build because it drives dist/index.js. The real-LLM suite is
    # local-only by policy (see docs/e2e.md).
    - name: TUI E2E (deterministic, no LLM)
      run: pnpm test:e2e:deterministic
      shell: bash
    # Failure evidence from the PTY suite (screenshots/recordings live in the
    # runner temp dir so they survive the test workspace cleanup).
    - name: Upload E2E artifacts on failure
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: e2e-artifacts-${{ runner.os }}-${{ github.run_id }}
        path: ${{ runner.temp }}/nova-e2e-artifacts
        if-no-files-found: ignore
        retention-days: 7
