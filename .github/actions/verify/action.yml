name: 'Verify gate'
description: 'Install, secret scan, audit, typecheck, test, build — the shared verification gate used by CI (push/PR) and the Publish workflow.'

inputs:
  node-version:
    description: 'Node.js version to run the gate on'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v4   # reads packageManager from package.json
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: "https://registry.npmjs.org/"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - name: Secret scan (tree + full history)
      run: node scripts/scan-secrets.mjs
      shell: bash
    - name: Audit (prod deps, high+)
      run: pnpm audit --prod --audit-level=high
      shell: bash
    - run: pnpm typecheck
      shell: bash
    - run: pnpm test
      shell: bash
    - run: pnpm build
      shell: bash
    # Deterministic TUI E2E: real PTY, no LLM calls, no secrets. Runs after
    # the build because it drives dist/index.js. The real-LLM suite is
    # local-only by policy (see docs/e2e.md).
    - name: TUI E2E (deterministic, no LLM)
      run: pnpm test:e2e:deterministic
      shell: bash
    # Failure evidence from the PTY suite (screenshots/recordings live in the
    # runner temp dir so they survive the test workspace cleanup).
    - name: Upload E2E artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-artifacts-${{ runner.os }}-${{ github.run_id }}
        path: ${{ runner.temp }}/nova-e2e-artifacts
        if-no-files-found: ignore
        retention-days: 7
