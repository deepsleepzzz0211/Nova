name: Publish

# Publishes on version tags: npm version patch && git push --tags
# Prerelease tags (contain '-') publish to dist-tag "next"; stable tags
# publish to "latest".
# Requires the NPM_TOKEN secret (classic Automation token — bypasses 2FA).
# Provenance requires a public GitHub remote.

on:
  push:
    tags: ["v*"]

# Least privilege at the top level (audit-fixes 07); the publish job below
# escalates explicitly for provenance + Release.
permissions:
  contents: read

# Two tags pushed back-to-back must NOT cancel each other — a publish cut
# mid-`npm publish` is the worst failure mode this workflow has. Serialize.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  # Singleton secret scan (audit-fixes 05): one full-history pass per
  # release instead of one per matrix leg, and with fetch-depth: 0 the
  # history is actually scanned (see ci.yml for the depth-1 evidence).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Secret scan (tree + full history)
        run: node scripts/scan-secrets.mjs

  # Full gate across all three OS on the supported Node line. Publishing
  # happens only when every combination is green.
  test:
    needs: secret-scan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/verify
        with:
          node-version: ${{ matrix.node }}
      # Ship the bytes that were actually verified (p1-p2 05, report-13):
      # the ubuntu leg exports the build its gate just exercised, the
      # publish job consumes it instead of reinstalling+rebuilding (~37 s
      # saved and no "fresh build in a slightly different env" divergence).
      - name: Checksum the verified dist (manifest consumed by the publish job)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          (cd dist && find . -type f | sort | xargs sha256sum) | sed 's|  \./|  dist/|' > dist-checksums.txt
          cat dist-checksums.txt
      - name: Upload verified dist
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 1
      - name: Upload dist checksum manifest
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-checksums
          path: dist-checksums.txt
          retention-days: 1

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for npm provenance
      contents: write # for GitHub Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org/"
      - name: Download the dist the test matrix verified
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Download the checksum manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-checksums
      - name: Verify dist integrity (programmatic, p1-p2 05 review)
        shell: bash
        run: sha256sum -c dist-checksums.txt
      - name: Pack manifest assertions (bin present, dev dirs absent)
        run: node scripts/pack-check.mjs
      - name: Dry-run pack (catch file-inclusion surprises before publishing)
        # --ignore-scripts: prepublishOnly (scan/typecheck/test/build) is the
        # LOCAL release safety net. In this job every one of those checks has
        # already run as its own explicit step, and the deps aren't installed
        # by design (p1-p2 05) — running it here would only crash on tsc.
        run: npm publish --dry-run --access public --ignore-scripts --tag next
      - name: Publish
        id: publish
        shell: bash
        run: |
          set -o pipefail
          # Prerelease tags (contain '-') publish to dist-tag "next" so they
          # never occupy "latest"; stable tags publish to "latest" (default).
          EXTRA_FLAGS=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease tag → dist-tag: next"
            EXTRA_FLAGS="--tag next"
          fi
          npm publish --access public --provenance --ignore-scripts $EXTRA_FLAGS 2>&1 | tee /tmp/publish.log
          exit ${PIPESTATUS[0]}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Propagation wait gates the Release (don't announce a version the
      # registry cannot serve yet), but registry lag beyond the budget must
      # not red the job of an artifact that published fine (beta.2 lesson —
      # the budget stays ~5 min, only the cadence got smarter, p1-p2 06).
      - name: Wait for registry propagation
        shell: bash
        run: node scripts/wait-for-registry.mjs "$(node -p "require('./package.json').version")"
      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify installed package boots (headless smoke)
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm view @posuiqianqiu/nova@$VERSION version
          npm i -g @posuiqianqiu/nova@$VERSION
          # Headless TUI boot check: the bin must load, resolve deps and
          # start Ink. With a dummy key the provider init succeeds and Ink
          # renders — without a TTY it exits with the Raw mode error, which
          # is exactly the expected output here. (No dummy key → a
          # credentials fatal fires before the TUI ever starts.)
          NOVA_API_KEY=sk-ci-smoke-dummy timeout 60 nova > /tmp/boot.log 2>&1 || true
          cat /tmp/boot.log
          grep -q "Raw mode is not supported" /tmp/boot.log \
            && { echo "bin boot OK"; } || { echo "bin boot FAILED"; exit 1; }
      - name: Dump publish log on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Publish log (failure)"
            echo '```'
            tail -60 /tmp/publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
