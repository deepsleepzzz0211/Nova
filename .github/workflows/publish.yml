name: Publish

# Publishes on version tags: npm version patch && git push --tags
# Requires the NPM_TOKEN secret (npm granular access token, Automation type).
# Provenance additionally requires the repo to be hosted on a public GitHub
# remote; otherwise remove the --provenance flag.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for npm provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org/"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit (prod deps, high+)
        run: pnpm audit --prod --audit-level=high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Publish
        id: publish
        shell: bash
        run: |
          npm publish --access public --provenance 2>&1 | tee /tmp/publish.log
          exit ${PIPESTATUS[0]}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify published package (install from registry + boot)
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Registry/CDN propagation can lag a few seconds after publish
          for i in 1 2 3 4 5 6; do
            npm view @posuiqianqiu/nova@$VERSION version >/dev/null 2>&1 && break
            echo "waiting for registry sync ($i/6)..."; sleep 15
          done
          npm view @posuiqianqiu/nova@$VERSION version
          npm i -g @posuiqianqiu/nova@$VERSION
          # Headless TUI boot check: the bin must load, resolve deps and
          # start Ink. Without a TTY, Ink exits with the Raw mode error —
          # which is exactly the expected output here.
          nova 2>&1 | grep -q "Raw mode is not supported" \
            && echo "bin boot OK" || { echo "bin boot FAILED"; exit 1; }
      - name: Dump publish log on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Publish log (failure)"
            echo '```'
            tail -60 /tmp/publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
