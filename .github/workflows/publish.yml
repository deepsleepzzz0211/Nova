name: Publish

# Publishes on version tags: npm version patch && git push --tags
# Prerelease tags (contain '-') publish to dist-tag "next"; stable tags
# publish to "latest".
# Requires the NPM_TOKEN secret (classic Automation token — bypasses 2FA).
# Provenance requires a public GitHub remote.

on:
  push:
    tags: ["v*"]

jobs:
  # Singleton secret scan (audit-fixes 05): one full-history pass per
  # release instead of one per matrix leg, and with fetch-depth: 0 the
  # history is actually scanned (see ci.yml for the depth-1 evidence).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Secret scan (tree + full history)
        run: node scripts/scan-secrets.mjs

  # Full gate across all three OS on the supported Node line. Publishing
  # happens only when every combination is green.
  test:
    needs: secret-scan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/verify
        with:
          node-version: ${{ matrix.node }}

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for npm provenance
      contents: write # for GitHub Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0   # reads packageManager from package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org/"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Dry-run pack (catch file-inclusion surprises before publishing)
        run: npm publish --dry-run --access public
      - name: Publish
        id: publish
        shell: bash
        run: |
          set -o pipefail
          # Prerelease tags (contain '-') publish to dist-tag "next" so they
          # never occupy "latest"; stable tags publish to "latest" (default).
          EXTRA_FLAGS=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease tag → dist-tag: next"
            EXTRA_FLAGS="--tag next"
          fi
          npm publish --access public --provenance $EXTRA_FLAGS 2>&1 | tee /tmp/publish.log
          exit ${PIPESTATUS[0]}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Propagation wait gates the Release (don't announce a version the
      # registry cannot serve yet), but registry lag beyond this budget must
      # not skip the Release of an artifact that published fine (beta.2:
      # verify's old 90s budget red-failed the job and the Release had to
      # be created by hand).
      - name: Wait for registry propagation
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 20); do
            npm view @posuiqianqiu/nova@$VERSION version >/dev/null 2>&1 && exit 0
            echo "waiting for registry sync ($i/20)..."; sleep 15
          done
          echo "version still not visible after 5 minutes" >&2
          exit 1
      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify installed package boots (headless smoke)
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm view @posuiqianqiu/nova@$VERSION version
          npm i -g @posuiqianqiu/nova@$VERSION
          # Headless TUI boot check: the bin must load, resolve deps and
          # start Ink. With a dummy key the provider init succeeds and Ink
          # renders — without a TTY it exits with the Raw mode error, which
          # is exactly the expected output here. (No dummy key → a
          # credentials fatal fires before the TUI ever starts.)
          NOVA_API_KEY=sk-ci-smoke-dummy timeout 60 nova > /tmp/boot.log 2>&1 || true
          cat /tmp/boot.log
          grep -q "Raw mode is not supported" /tmp/boot.log \
            && { echo "bin boot OK"; } || { echo "bin boot FAILED"; exit 1; }
      - name: Dump publish log on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Publish log (failure)"
            echo '```'
            tail -60 /tmp/publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
