name: Mutation

# Weekly drift alarm: Stryker's perTest coverage silently broke when vitest
# drifted 4 -> 5 (score 71.95% -> 7.11% with everything "no coverage").
# This scheduled run catches such breakage without paying 7 minutes per PR.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

# Read-only: clones the repo and uploads a run artifact (no repo writes).
permissions:
  contents: read

# A manual re-run supersedes the scheduled one; never stack two Stryker runs.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ratchet semantics (test-effectiveness 01): stryker.config.json
  # thresholds.break fails this job when the score drops below the recorded
  # baseline (scripts/mutation-baseline.json — a pure snapshot, thresholds
  # live only in stryker config; see p1-p2 04 policy test). Improve ->
  # raise the stryker thresholds and refresh the snapshot in the same PR;
  # the baseline's topSurvived list drives the survived-mutant hunts.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/verify
        with:
          node-version: 22
      - run: pnpm test:mutation
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/mutation.html
