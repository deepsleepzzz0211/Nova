name: CI

# Continuous verification for everyday work: every push to main and every
# PR runs the same gate as the release pipeline (minus the OS corners that
# the release matrix covers — macOS and Windows×Node20 are intentionally
# deferred to the tag-gated Publish workflow).
# Releases stay tag-gated: see publish.yml (tags v*).

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Reduced matrix: both Node lines on Linux + the Windows job (path/shell
  # semantics differ enough to be worth a standing check). Full 3 OS x 2
  # Node runs on the release tag.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: "https://registry.npmjs.org/"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secret scan (tree + full history)
        run: node scripts/scan-secrets.mjs
      - name: Audit (prod deps, high+)
        run: pnpm audit --prod --audit-level=high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
