name: CI

# Continuous verification for everyday work: every push to main and every
# PR runs the same gate as the release pipeline (minus the OS corners that
# the release matrix covers — macOS and Windows×Node20 are intentionally
# deferred to the tag-gated Publish workflow).
# Releases stay tag-gated: see publish.yml (tags v*).

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Node 22 only — Node 20 hit EOL 2026-04-30 and its Windows ConPTY input
  # path drops the Shift modifier (libuv#4979), making PTY suites unsatisfiable
  # there. Full 3 OS runs on the release tag.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify
        with:
          node-version: ${{ matrix.node }}

  # Single stable-name aggregate gate: branch protection requires ONLY this
  # context, so adding or dropping matrix cells above never deadlocks merges
  # (a matrix-expanded required check that stops being reported blocks every
  # PR with "Expected — Waiting for status to be reported").
  ci-ready:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every matrix leg succeeded
        run: exit 1
        if: ${{ needs.test.result != 'success' }}
