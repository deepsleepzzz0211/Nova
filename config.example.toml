# Nova Configuration Example
# Copy this file to config.toml and customize

[llm]
# Provider: "openai", "anthropic", "ollama"
provider = "openai"
# API key (or use NOVA_API_KEY environment variable)
api_key = ""
# Base URL for API (optional, defaults to provider's default)
# base_url = "https://api.openai.com/v1"
# Model to use
model = "gpt-4o"
# Maximum tokens for response
max_tokens = 4096
# Temperature (0.0 - 2.0)
temperature = 0.7

[agent]
# Maximum tool execution rounds per request
max_tool_rounds = 50
# Additional system prompt
system_prompt = ""
# Context strategy: "truncate" or "summarize"
context_strategy = "truncate"

[search]
# Search provider: "tavily" or "duckduckgo"
provider = "tavily"
# Tavily API key (optional, free tier works without)
# tavily_api_key = ""

[permission]
# Auto-approve file writes (use with caution)
auto_approve_file_write = false
# Auto-approve bash commands (use with caution)
auto_approve_bash = false
# Commands that are always allowed without confirmation
always_allow_commands = ["git status", "git diff", "ls", "pwd"]

# MCP servers configuration
[[mcp_servers]]
name = "example-server"
command = "node"
args = ["./server.js"]
# env = { API_KEY = "xxx" }
# auto_approve = false

