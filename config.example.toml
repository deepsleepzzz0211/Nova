# Nova Configuration Example
# Copy this file to config.toml and customize

[llm]
# Provider: "openai", "anthropic", "ollama"
provider = "openai"
# API key (or use NOVA_API_KEY environment variable)
api_key = ""
# Base URL for API (optional, defaults to provider's default)
# base_url = "https://api.openai.com/v1"
# Model to use
model = "gpt-4o"
# Maximum tokens for response
max_tokens = 4096
# Temperature (0.0 - 2.0)
temperature = 0.7
# Prompt-cache retention passed to the provider (pi-ai cacheRetention):
# "short" = provider default (Anthropic ephemeral 5m), "long" = extended TTL
# where the model supports it, "none" = disable explicit cache markers.
# Unset behaves like "short".
# cache_retention = "short"

# Transparent retries when a stream dies before real content lands
# (tool-call arguments half-streamed, no text yet). 0 disables. Default 1.
# stream_max_retries = 1

[agent]
# Maximum tool execution rounds per request
max_tool_rounds = 50
# Additional system prompt
system_prompt = ""
# Context strategy: "truncate" or "compact"
context_strategy = "truncate"
# Compaction trigger reserve (tokens kept for the LLM response);
# trigger = model context window − reserve. Default 16384.
# context_reserve_tokens = 16384
# Recent tokens kept verbatim during compaction. Default 20000.
# context_keep_recent_tokens = 20000
# Default model spec for subagents (call param > this > parent model).
# subagent_model = ""
# Idle recycle window (ms) for named persistent bash sessions (ticket 07).
# shell_session_idle_ms = 600000   # default; 0 or negative disables recycling
# Max concurrently running subagents. Default 3.
# subagent_max_concurrent = 3
# Token ceiling for the Available-Skills listing in the system prompt;
# descriptions are truncated in order to fit. Default 2000.
# skills_budget_tokens = 2000

[search]
# Search backend: Tavily API (free 1000/month at tavily.com).
# DuckDuckGo was removed (unreachable in CN networks).
provider = "tavily"
# Tavily API key (optional, free tier works without)
# tavily_api_key = ""

[permission]
# Auto-approve file writes (use with caution)
auto_approve_file_write = false
# Auto-approve bash commands (use with caution)
auto_approve_bash = false
# Commands that are always allowed without confirmation
always_allow_commands = ["git status", "git diff", "ls", "pwd"]

[sandbox]
# Tier-1 workspace path policy. true (default) = today's approval behavior.
# false = hard policy: writes outside the workspace (except the nova home
# tree) are DENIED — the always-allow list cannot escape it; commands whose
# write target cannot be resolved statically are refused too.
workspace_write = true
# Tier-2 OS enforcement (ticket 02). off = default (tier-1 policy only).
# auto = on win32, shell children are wrapped in a LOW-integrity token AFTER
# a per-shell smoke probe (starts AND writes the granted roots). Wrapped
# shells get OS-level refusal outside workspace + ~/.nova + temp (script-
# inlined writes included), with session-scoped icacls grants restored on
# exit. Shells that fail the probe (Git Bash cannot start at Low; writing a
# Medium-labeled root needs relabel privileges) run unwrapped with a visible
# notice and stay on tier-1. On POSIX, auto prints a one-time stderr notice
# that landlock is not wired yet and keeps tier 1. Re-run after changing.
# os_level = "off"

# Declarative hooks ([[hooks]] is an array of tables). The command receives
# the event JSON on stdin ({tool, params, result?}). pre_tool_use denies with
# exit code 2 (stderr becomes the reason) or {"deny": true, "reason": "..."}
# on stdout; post_tool_use stdout is appended to the tool result as a
# [post-tool-use] note the model can react to.
# [[hooks]]
# event = "post_tool_use"
# matcher = "write_file"                 # or "*" for every tool
# command = "node scripts/note-filesize.js"   # reads the JSON, prints a note
# timeout_ms = 10000                     # default; pre hooks fail closed on timeout

# User-defined slash commands do NOT live in this file: they are markdown
# files in ~/.nova/commands/<name>.md (NOVA_HOME-migrated) with optional
# front-matter (description, argument_hint) and a prompt-template body
# ($1..$9 / $ARGUMENTS slots). Built-ins always win a name clash; /help
# lists both groups. See README.

# MCP servers configuration
[[mcp_servers]]
name = "example-server"
command = "node"
args = ["./server.js"]
# env = { API_KEY = "xxx" }
# auto_approve = false

# Example configurations for different providers

# [llm]
# provider = "anthropic"
# api_key = "your-anthropic-api-key"
# model = "claude-3-5-sonnet-20241022"
# base_url = "https://api.anthropic.com"

# [llm]
# provider = "ollama"
# base_url = "http://localhost:11434"
# model = "llama3"
# api_key = ""  # Not needed for local Ollama
# Model catalog: declare custom providers/models in ~/.nova/models.json
# (pi-style data-driven catalog). Example:
# {
#   "providers": {
#     "my-vllm": {
#       "baseUrl": "http://localhost:8000/v1",
#       "api": "openai-completions",
#       "apiKey": "$MY_API_KEY",
#       "models": [{ "id": "qwen2.5-coder:7b", "contextWindow": 32768 }]
#     }
#   }
# }
# Built-in providers (openai / anthropic / ollama) can be redirected by
# redeclaring them (e.g. only "baseUrl"); their models are kept.

# Model pricing lives in ~/.nova/models.json (optional) and drives the footer
# cost display; rates are USD per 1M tokens. Missing cache rates fall back to
# the input rate, and a model without pricing shows '—'.
#   { "id": "gpt-4.1", "cost": { "input": 2.0, "output": 8.0, "cacheRead": 0.5 } }
